services:
  - type: web
    name: checker-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.main
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///data/bot.db
      - key: ADMIN_IDS
        sync: false
      - key: LOG_LEVEL
        value: INFO
    disk:
      name: bot-data
      mountPath: /data
      sizeGB: 1
